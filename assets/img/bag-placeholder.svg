<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-label="Handbag placeholder illustration">
  <defs>
    <linearGradient id="leather" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#4a3527"/>
      <stop offset="38%" stop-color="#7a5a41"/>
      <stop offset="64%" stop-color="#5d4230"/>
      <stop offset="100%" stop-color="#3a2a1e"/>
    </linearGradient>
    <linearGradient id="flapg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#8a6549"/>
      <stop offset="100%" stop-color="#5a4030"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0c07e"/>
      <stop offset="45%" stop-color="#c0a16b"/>
      <stop offset="100%" stop-color="#8d7345"/>
    </linearGradient>
  </defs>

  <!-- handle -->
  <path d="M148 150 C148 92, 252 92, 252 150" fill="none" stroke="url(#leather)" stroke-width="13" stroke-linecap="round"/>
  <path d="M148 150 C148 100, 252 100, 252 150" fill="none" stroke="#00000022" stroke-width="3" stroke-linecap="round"/>

  <!-- body -->
  <path d="M92 168 h216 a14 14 0 0 1 14 14 v198 a22 22 0 0 1 -22 22 h-200 a22 22 0 0 1 -22 -22 v-198 a14 14 0 0 1 14 -14 z"
        fill="url(#leather)"/>

  <!-- side gussets -->
  <path d="M92 168 l26 24 v186 a22 22 0 0 1 -22 22 h-4 a22 22 0 0 1 -14 -22 v-196 a14 14 0 0 1 14 -14 z" fill="#00000026"/>
  <path d="M308 168 l-26 24 v186 a22 22 0 0 0 22 22 h4 a22 22 0 0 0 14 -22 v-196 a14 14 0 0 0 -14 -14 z" fill="#00000026"/>

  <!-- flap -->
  <path d="M118 168 h164 v92 a10 10 0 0 1 -10 10 h-144 a10 10 0 0 1 -10 -10 z" fill="url(#flapg)"/>
  <path d="M118 270 h164" stroke="#00000033" stroke-width="2" fill="none"/>

  <!-- stitching -->
  <path d="M104 190 v186" stroke="#d9c3a5" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.45" fill="none"/>
  <path d="M296 190 v186" stroke="#d9c3a5" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.45" fill="none"/>

  <!-- clasp -->
  <rect x="176" y="248" width="48" height="34" rx="6" fill="url(#brass)"/>
  <rect x="186" y="258" width="28" height="14" rx="3" fill="#00000033"/>
  <circle cx="200" cy="300" r="9" fill="none" stroke="url(#brass)" stroke-width="4"/>

  <!-- feet -->
  <circle cx="126" cy="404" r="6" fill="url(#brass)"/>
  <circle cx="274" cy="404" r="6" fill="url(#brass)"/>
</svg>
