<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-label="Timepiece placeholder illustration">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a4149"/>
      <stop offset="42%" stop-color="#8d959d"/>
      <stop offset="60%" stop-color="#5b636b"/>
      <stop offset="100%" stop-color="#2c3238"/>
    </linearGradient>
    <linearGradient id="dial" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#1b232b"/>
      <stop offset="100%" stop-color="#0b1116"/>
    </linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f353b"/>
      <stop offset="50%" stop-color="#767e86"/>
      <stop offset="100%" stop-color="#2f353b"/>
    </linearGradient>
  </defs>

  <!-- bracelet -->
  <g fill="url(#strap)" opacity="0.95">
    <rect x="152" y="18"  width="96" height="34" rx="9"/>
    <rect x="152" y="58"  width="96" height="34" rx="9"/>
    <rect x="152" y="98"  width="96" height="34" rx="9"/>
    <rect x="152" y="388" width="96" height="34" rx="9"/>
    <rect x="152" y="428" width="96" height="34" rx="9"/>
    <rect x="152" y="468" width="96" height="34" rx="9"/>
  </g>

  <!-- crown -->
  <rect x="316" y="245" width="20" height="30" rx="5" fill="url(#steel)"/>

  <!-- case -->
  <circle cx="200" cy="260" r="122" fill="url(#steel)"/>
  <circle cx="200" cy="260" r="112" fill="#20272e"/>

  <!-- bezel markers -->
  <g stroke="#c0a16b" stroke-width="2" opacity="0.55">
    <line x1="200" y1="152" x2="200" y2="164"/>
    <line x1="308" y1="260" x2="296" y2="260"/>
    <line x1="200" y1="368" x2="200" y2="356"/>
    <line x1="92"  y1="260" x2="104" y2="260"/>
  </g>

  <!-- dial -->
  <circle cx="200" cy="260" r="98" fill="url(#dial)"/>
  <circle cx="200" cy="260" r="98" fill="none" stroke="#c0a16b" stroke-width="1" opacity="0.35"/>

  <!-- hour indices -->
  <g fill="#c0a16b" opacity="0.85">
    <rect x="196" y="176" width="8" height="20" rx="2"/>
    <rect x="264" y="256" width="20" height="8" rx="2"/>
    <rect x="196" y="324" width="8" height="20" rx="2"/>
    <rect x="116" y="256" width="20" height="8" rx="2"/>
  </g>
  <g fill="#8d959d" opacity="0.6">
    <rect x="238" y="192" width="7" height="16" rx="2" transform="rotate(30 241.5 200)"/>
    <rect x="270" y="224" width="7" height="16" rx="2" transform="rotate(60 273.5 232)"/>
    <rect x="270" y="280" width="7" height="16" rx="2" transform="rotate(120 273.5 288)"/>
    <rect x="238" y="312" width="7" height="16" rx="2" transform="rotate(150 241.5 320)"/>
    <rect x="155" y="312" width="7" height="16" rx="2" transform="rotate(210 158.5 320)"/>
    <rect x="123" y="280" width="7" height="16" rx="2" transform="rotate(240 126.5 288)"/>
    <rect x="123" y="224" width="7" height="16" rx="2" transform="rotate(300 126.5 232)"/>
    <rect x="155" y="192" width="7" height="16" rx="2" transform="rotate(330 158.5 200)"/>
  </g>

  <!-- subdial -->
  <circle cx="200" cy="316" r="26" fill="none" stroke="#8d959d" stroke-width="1" opacity="0.5"/>

  <!-- hands -->
  <g stroke="#f0ece4" stroke-linecap="round">
    <line x1="200" y1="260" x2="200" y2="196" stroke-width="7"/>
    <line x1="200" y1="260" x2="252" y2="288" stroke-width="5"/>
  </g>
  <line x1="200" y1="272" x2="200" y2="188" stroke="#c0a16b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="200" cy="260" r="6" fill="#c0a16b"/>
</svg>
